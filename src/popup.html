<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ariam connect</title>
<link rel="stylesheet" href="vendor/style.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="topbar">
<strong class="topbar-title">ariam connect</strong>
<button type="button" id="off" class="btn" hidden>Off</button>
<button type="button" id="settings" class="btn" title="Settings" aria-label="Settings">&#x2699;&#xFE0E;</button>
</header>
<p id="setup" class="view" hidden>Set up ariam connect in settings.</p>
<form id="unlock" class="view" hidden>
<label for="passphrase">Passphrase</label>
<input id="passphrase" type="password" autocomplete="off">
<button type="submit" class="btn btn-primary">Turn on</button>
<p id="unlock-result" role="status"></p>
</form>
<main id="on" class="app" hidden></main>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-message">
<p id="confirm-message" class="confirm-message"></p>
<div class="confirm-actions">
<button type="button" id="confirm-cancel" class="btn btn-danger">Cancel download</button>
<button type="button" id="confirm-keep" class="btn">Keep</button>
</div>
</dialog>
<script type="module" src="popup.js"></script>
</body>
</html>
